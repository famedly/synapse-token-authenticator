name: Python

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    env:
      HATCH_ENV: "ci"
    # Workaround for read-only dependabot GITHUB_TOKEN in meow-coverage
    permissions:
      issues: write
      pull-requests: write
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch

      - name: Formatting
        uses: famedly/black@stable
        with:
          options: "--check --verbose"

      - name: Prepare lint
        shell: bash
        run: echo PYTHON_TARGET="py${{ matrix.python-version }}" | sed -r "s/\.//" >> $GITHUB_ENV

      - name: Lint
        uses: chartboost/ruff-action@1ec810db51b3ebdd902c812e962d2f7aafe85fcf
        with:
          args: check --target-version ${{ env.PYTHON_TARGET }}

      - name: Tests and coverage
        run: hatch test -p -c

      - name: Codecov - Upload coverage
        uses: codecov/codecov-action@ca0a928a4cb3911011e868128a5cd90437c12db1
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: "lcov.info"
